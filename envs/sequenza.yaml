# sequenza-utils (bam2seqz/seqz_binning). r-sequenza lives in its own env
# (envs/sequenza_r.yaml): installing both together makes the python
# `sequenza` package shadow sequenza-utils' commands module (live:
# 'conflicting subparser: bam2seqz').
name: sequenza
channels:
  - conda-forge
  - bioconda
dependencies:
  - sequenza-utils>=3.0.0
