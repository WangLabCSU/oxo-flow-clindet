# Ported verbatim from upstream envs/clindet.yaml (pins preserved; snakemake
# plugins dropped — the port runs natively under oxo-flow).
name: clindet
channels:
  - conda-forge
  - bioconda
dependencies:
  - ascat>=3.2.0
  - bcftools>=1.22
  - r-base
  - r-tidyverse
  - cancerit-allelecount
  - bwa>=0.7.18
  - bwidget>=1.9.14
  - bzip2
  - htslib
  - python
  - samtools
  - varscan=2.4.6
  - vcflib
  - vcftools
  - picard
  - ucsc-fasplit
  - bedtools
  - fastp
  - r-exomedepth
  - r-r.utils
  - configparser
  - sra-tools
  - pysam
  - pip
  - ca-certificates
  - bioconductor-tximport
  # upstream env lacks cyvcf2 although its delly2bnd rule (WGS SV, conda
  # clindet_main) imports it — upstream bug, fixed here
  - cyvcf2
