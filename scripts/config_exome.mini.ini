# Mini-fixture variant of config_exome.ini: forceGCcontentNormalization = 0
# (the 900 bp chr21 reference has no GC-content spread — Control-FREEC
# aborts with 'zero reads in windows with the GC-content around 0.35';
# real runs use config_exome.ini with the upstream normalization on).

[general]                                 
chrLenFile =     
window = 0                                
ploidy = 2,3,4,5                                
outputDir = 
sex = XY                                  
breakPointType=4                          
maxThreads=6                              
breakPointThreshold=0.8                   
noisyData=TRUE                            
printNA=FALSE                             
readCountThreshold=50                     
chrFiles = 
forceGCcontentNormalization = 0

[sample]
mateFile = 
inputFormat = BAM                  
mateOrientation = FR

[control]
mateFile = 
inputFormat = BAM
mateOrientation = FR

[target]                                                       
captureRegions = 

[BAF]