name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      # The merged single-entry workflow needs wildcard-scoped `when`
      # (Traitome/oxo-flow#187) and per-instance expand_inputs binding —
      # first shipped in v0.16.0 (2026-08-27), the documented engine floor.
      - name: Install oxo-flow (v0.16.0, cargo)
        run: |
          cargo install --git https://github.com/Traitome/oxo-flow oxo-flow-cli --tag v0.16.0 --locked --quiet
          oxo-flow --version

      # run.sh covers the run_type loop (default-wes / wgs / rna dry-runs).
      - name: Validate, lint, dry-run
        run: bash ./test/run.sh
